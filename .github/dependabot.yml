version: 2

updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # One PR per concern keeps the review load sane.
      types:
        patterns: ["@types/*"]
      linting:
        patterns: ["eslint*", "typescript-eslint", "prettier"]
      testing:
        patterns: ["vitest", "@vitest/*", "supertest", "@types/supertest"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(docker)"
