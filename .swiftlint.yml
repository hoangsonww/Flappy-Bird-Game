# SwiftLint configuration.
#
# Optional: `make lint-swift` skips cleanly when SwiftLint is not installed.
# The rules below match how the codebase is actually written — a config that
# fires on every file teaches people to ignore it.

included:
  - FlappyBird
  - FlappyBirdTests

excluded:
  - build
  - backend
  - node_modules

disabled_rules:
  # SpriteKit scene setup is legitimately long and reads better in one place.
  - function_body_length
  - type_body_length
  - file_length
  # Colour/size literals in a game are clearer as numbers than as constants.
  - no_magic_numbers

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - modifier_order
  - multiline_arguments
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

identifier_name:
  min_length: 1
  excluded: [x, y, dx, dy, id, up, to]

nesting:
  type_level: 2

cyclomatic_complexity:
  warning: 15
  error: 25

# The scenes intentionally hold several child nodes.
type_name:
  max_length: 45

force_unwrapping:
  severity: warning

implicitly_unwrapped_optional:
  severity: warning
